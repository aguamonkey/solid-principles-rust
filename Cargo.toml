[package]
name = "solid-workbook"
version = "1.0.0"
edition = "2021"
default-run = "solid-workbook"
license = "MIT"
description = "Release Console: learn Rust and SOLID through reliable build publication"

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "release-console"
path = "src/bin/release_console.rs"
