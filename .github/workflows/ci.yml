name: Release Console checks
on:
  push:
    branches: [develop, main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --bins --locked
      - run: cargo run --locked -- all
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/smoke_console.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tooling/browser/package-lock.json
      - run: npm ci
        working-directory: tooling/browser
      - run: npm run format:check
        working-directory: tooling/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tooling/browser
      - run: npm test
        working-directory: tooling/browser
